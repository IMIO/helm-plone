suite: solr tests
templates:
  - templates/solr.yaml
tests:
  - it: should create solr deployment when enabled
    set:
      solr:
        enabled: true
        port: 8983
        image:
          repository: solr
          tag: "9.6.1-slim"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: solr:9.6.1-slim

  - it: should not create solr when disabled
    set:
      solr:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set persistence correctly
    set:
      solr:
        enabled: true
        persistence:
          enabled: true
          size: 16Gi
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 16Gi
