suite: middleware tests
templates:
  - templates/middleware.yaml
tests:
  - it: should create middleware when ingress is enabled
    set:
      hostname: "plone.example.com"
      plone_path: "/Plone"
      ingress:
        enabled: true
    asserts:
      - isKind:
          of: Middleware
      - matchRegex:
          path: spec.replacePathRegex.replacement
          pattern: /VirtualHostBase/https/plone.example.com:443/Plone/VirtualHostRoot/

  - it: should not create middleware when ingress is disabled
    set:
      ingress:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct regex pattern
    set:
      ingress:
        enabled: true
    asserts:
      - equal:
          path: spec.replacePathRegex.regex
          value: ^/(.*)
