suite: serviceaccount tests
templates:
  - templates/serviceaccount.yaml
tests:
  - it: should create a service account without token automount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should enable token automount when configured
    set:
      serviceAccount:
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should use a custom name when set
    set:
      serviceAccount:
        name: my-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-sa

  - it: should not create a service account when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
