suite: ingress tests
templates:
  - templates/ingress.yaml
tests:
  - it: should create an ingress when enabled
    set:
      ingress:
        enabled: true
        className: "traefik"
        hosts:
          - host: "plone.example.com"
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: traefik

  - it: should not create an ingress when disabled
    set:
      ingress:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set TLS configuration correctly
    set:
      ingress:
        enabled: true
        tls:
          - hosts:
              - "plone.example.com"
            secretName: plone-tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: plone-tls
      - contains:
          path: spec.tls[0].hosts
          content: "plone.example.com"

  - it: should set annotations correctly
    set:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.entrypoints"]
          value: websecure

  - it: should resolve template variables in annotations
    set:
      hostname: "my-plone.example.com"
      plone_path: "/Plone"
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ .Release.Name }}-plone-vhm@kubernetescrd"
    asserts:
      - matchRegex:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          pattern: plone-vhm@kubernetescrd
